# Starter quality gates from `arc-quality init` -- edit freely. Each stage lists check ids;
# `arc-quality plan --stage <stage>` shows what a stage will run. The duplication guards
# (ADR-0148) start advisory: seed a guard's ledger, then remove its `severity: advisory`.
version: 1
base_branch: main
structure:
  roots: &id001
  - app
  layers:
  - name: project
    paths:
    - app/**
stages:
  devloop:
  - format
  - lint
  - unused
  - canonical-helpers
  - complexity
  - module-purpose-doc
  - reuse-catalog-freshness
  - secrets
  - types-fast
  ci:
  - duplication
  - tests
  baseline:
  - tests
checks:
  canonical-helpers:
    severity: advisory
  module-purpose-doc:
    severity: advisory
  reuse-catalog-freshness:
    severity: advisory
    settings:
      catalogs:
      - name: capability-index
        generator: arc_quality.capability_index:expected_files
        output: docs/CAPABILITY-INDEX.md
        compare_mode: row-keyed
        regenerate: arc-quality index --write
  duplication:
    severity: advisory
    settings:
      roots: *id001
  format:
    fixer: true
  lint:
    fixer: true
  unused:
    fixer: true
  tests:
    diff_scoped: true
